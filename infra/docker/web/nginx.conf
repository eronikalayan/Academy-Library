server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin reverse proxy to the api Compose service: the browser only
  # ever talks to this origin, so the session cookie set by the API is a
  # same-origin, same-site cookie — no CORS, no cross-site cookie exception
  # needed. See docs/architecture/authentication.md ("Cookie policy").
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
